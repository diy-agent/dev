[project]
name = "diydev"
version = "0.1.15" # x-release-please-version
description = "diy 开发流程 CLI - issue 与 worktree 统一管理"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=3.0",
    "diy-cli",
    "diy-ui",
    "pandas>=3.0.3",
    "panel>=1.9.3",
    "pyright>=1.1.409",
    "pytest-qt>=4.2",
    "pyside6>=6.8,<6.9",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "ruff>=0.15.15",
]

[project.scripts]
dai = "diydev._dai_cli:main"

[tool.uv.sources]
diy-cli = { path = "../diy/pkgs/diy-cli",editable = true }
diy-ui = { path = "../diy/pkgs/diy-ui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diydev"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
# 严格模式
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
lint.ignore = [
    "E501",  # 行长度由 formatter 管理
    "N806",  # 函数内大写常量有可读性价值
]

[tool.ruff.lint.per-file-ignores]
"src/diydev/_doctor_cmd.py" = ["B007"]
"src/diydev/_git_ops.py" = ["B904"]
"src/diydev/_sandbox_cmd.py" = ["B006", "SIM108", "SIM105"]
