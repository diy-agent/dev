[project]
name = "diy-dev"
version = "0.1.15" # x-release-please-version
description = "diy 开发环境 — 测试、构建、lint"
requires-python = ">=3.12"
dependencies = [
    "diy-core",
    "diy-app",
    "diy-cli",
]

[tool.uv]
package = true
override-dependencies = ["nodejs-wheel-binaries; python_version == '9.9.9'"]

[tool.uv.sources]
nodejs-wheel-shim = { path = "_shims/nodejs_wheel_shim" }
diy-core = { path = "../diy/pkgs/diy-core" }
diy-app = { path = "../diy/pkgs/diy-app" }
diy-cli = { path = "../diy/pkgs/diy-cli" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.2",
    "basedpyright>=1.39.8",
    "ruff>=0.15.15",
    "pandas>=3.0.3",
    "mistune>=3.2.1",
    "agent-client-protocol>=0.10.1",
    "aiosqlite>=0.22.1",
    "nodejs-wheel-shim>=0.1.0",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "archive",
    "_research",
]

[tool.ruff]
# 严格模式
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
lint.ignore = [
    "E501",  # 行长度由 formatter 管理
    "N806",  # 函数内大写常量有可读性价值
    "N813",  # CamelCase import 别名（如 MarkdownIt as _md）不影响正确性
]
