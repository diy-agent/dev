[project]
name = "diydev"
version = "0.1.15" # x-release-please-version
description = "diy 开发流程 CLI - issue 与 worktree 统一管理"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=3.0",
    "pyright>=1.1.409",
    "rich>=13.0",
    "ruff>=0.15.15",
]

[project.scripts]
dev = "diydev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diydev"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
