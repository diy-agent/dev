<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>dev 启动器</title>
        <style>
            :root {
                --fg: #1a1a1a;
                --dim: #8b95a1;
                --line: #e4e7eb;
                --accent: #3b6fd4;
                --ok: #22a35c;
                --warn: #d97706;
                --err: #c0392b;
                --bg: #f7f8fa;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font:
                    13px/1.55 -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--fg);
                background: var(--bg);
                height: 100vh;
                display: flex;
                overflow: hidden;
            }

            /* 左侧树 */
            #side {
                width: 360px;
                min-width: 260px;
                max-width: 520px;
                background: #fff;
                border-right: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }
            /* worktree 详情页的页签：详情 / 外部仓库（diy.yaml 跟着 worktree 走） */
            .wt-tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 10px;
                border-bottom: 1px solid var(--line);
            }
            .wt-tab {
                appearance: none;
                border: 0;
                background: transparent;
                padding: 6px 10px;
                font: 12.5px/1.4 inherit;
                color: #6b7280;
                cursor: pointer;
                border-bottom: 2px solid transparent;
                margin-bottom: -1px;
            }
            .wt-tab:hover {
                color: #123a6b;
            }
            .wt-tab.on {
                color: #123a6b;
                font-weight: 600;
                border-bottom-color: #3b6fd4;
            }
            #side .top {
                padding: 11px 14px;
                border-bottom: 1px solid var(--line);
                font-weight: 600;
                font-size: 13.5px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #side .top small {
                font-weight: 400;
                color: var(--dim);
                font-size: 11px;
                margin-left: auto;
            }
            /* 页签：应用 / 外部仓库（##510） */
            .tabs {
                display: flex;
                gap: 4px;
                padding: 6px 10px;
                border-bottom: 1px solid var(--line);
                background: #fbfcfe;
            }
            .tab {
                padding: 3px 12px;
                font-size: 12px;
                border-radius: 12px;
                border: 1px solid transparent;
                background: transparent;
                color: #5b6470;
                cursor: pointer;
            }
            .tab:hover {
                color: var(--accent);
            }
            .tab.on {
                background: #eaf1fd;
                border-color: #cfe0fb;
                color: var(--accent);
                font-weight: 600;
            }
            /* ── 交叉表（C）：行=分支，列=app ── */
            .cx-wrap {
                padding: 4px 0;
                overflow-x: auto;
            }
            /* 每个仓库一个可折叠区块 */
            .cx-sec {
                margin-bottom: 6px;
            }
            .cx-head {
                display: flex;
                align-items: center;
                gap: 6px;
                width: 100%;
                padding: 5px 10px;
                border: 0;
                border-bottom: 1px solid var(--line);
                background: #fbfcfe;
                font: 600 11.5px ui-monospace, Menlo, monospace;
                color: #3a4149;
                cursor: pointer;
                text-align: left;
            }
            .cx-head:hover {
                background: #f3f6fa;
            }
            .cx-arrow {
                color: #98a1ac;
                width: 10px;
                flex: none;
            }
            .cx-repo-nm {
                flex: none;
            }
            .cx-meta {
                margin-left: auto;
                font-weight: 400;
                font-size: 10px;
                color: #9aa3ae;
            }
            .cx {
                border-collapse: separate;
                border-spacing: 0;
                font-size: 11px;
            }
            .cx th,
            .cx td {
                padding: 2px 3px;
                white-space: nowrap;
                border-bottom: 1px solid #f2f4f7;
            }
            .cx thead th {
                font: 600 10px ui-monospace, Menlo, monospace;
                color: #6b747f;
                text-align: center;
                border-bottom: 1px solid var(--line);
                position: sticky;
                top: 0;
                background: #fff;
                z-index: 1;
            }
            .cx .cx-br {
                font: 600 10.5px ui-monospace, Menlo, monospace;
                color: hsl(var(--h, 214), 48%, 26%);
                text-align: left;
                padding-left: 9px;
                padding-right: 10px;
                /* 分支名必须完整可见（长分支名不截断、不换行） */
                white-space: nowrap;
                position: sticky;
                left: 0;
                /* 行头 = 该分支色相的实底 + 左侧色条：整张表里最显眼的分支标识 */
                background: hsl(var(--h, 214), 52%, 88%);
                border-left: 3px solid hsl(var(--h, 214), 62%, 52%);
                z-index: 2;
            }
            .cx thead .cx-br {
                z-index: 3;
            }
            /*
             * 颜色梯度：每个 app 列一个色相（--h 由 JS 算好挂上）。
             * 表头 = 该色实底；单元格 = 该色极淡底；chip = 该色边框 / 运行中该色实底。
             * 目的在于「横向对位」：一列一个颜色，扫一眼就知道这一格属于哪个 app。
             */
            .cx .cx-col {
                min-width: 50px;
                max-width: 76px;
                overflow: hidden;
                text-overflow: ellipsis;
                background: hsl(214, 14%, calc(var(--l) * 1% - 16%));
                color: #3a4149;
                border-bottom: 1px solid hsl(214, 12%, 72%);
            }
            .cx thead .cx-col:hover {
                background: hsl(214, 20%, calc(var(--l) * 1% - 26%));
            }
            .cx .cx-cell {
                text-align: center;
                white-space: normal;
                background: hsl(var(--h), 52%, calc(var(--l) * 1%));
            }
            /* 空格子（该分支没有这个 app）：不染色，避免整片花掉 */
            .cx .cx-cell.na {
                background: #fff;
            }
            .cx tbody tr:hover .cx-cell {
                background: hsl(var(--h), 58%, calc(var(--l) * 1% - 6%));
            }
            .cx tbody tr:hover .cx-cell.na {
                background: #fafbfc;
            }
            .cx .cx-cell .chip {
                margin: 1px;
                font-size: 9.5px;
                padding: 0 4px;
                border-color: hsl(var(--h), 34%, 72%);
                background: hsl(var(--h), 30%, calc(var(--l) * 1% + 5%));
                color: hsl(var(--h), 45%, 26%);
            }
            .cx .cx-cell .chip:hover {
                border-color: hsl(var(--h), 55%, 50%);
            }
            /* 运行中：该色实底 + 深色字 + 加粗，一眼看出"这个在跑" */
            .cx .cx-cell .chip.on {
                background: hsl(var(--h), 62%, calc(var(--l) * 1% - 20%));
                border-color: hsl(var(--h), 62%, 45%);
                color: #fff;
                font-weight: 600;
                box-shadow: 0 0 0 1px hsl(var(--h), 62%, 45%);
            }
            .cx .cx-cell .chip.wait {
                background: hsl(var(--h), 72%, 88%);
                border-color: hsl(var(--h), 55%, 60%);
            }
            .cx .cx-cell .chip .dot {
                background: hsl(var(--h), 40%, 72%);
            }
            .cx .cx-cell .chip.on .dot {
                background: #fff;
            }
            .cx .cx-cell .chip.wait .dot {
                background: hsl(var(--h), 60%, 50%);
            }
            /* 分支列（行头）保持中性，不参与色相，否则整行都花 */
            .cx tbody tr:hover .cx-br {
                background: hsl(var(--h, 214), 55%, 82%);
            }
            /* 分支名 = 进 worktree 详情的入口（不点 launch 也能 build / sync / 看详情） */
            .cx .cx-br-btn {
                appearance: none;
                border: 0;
                background: transparent;
                padding: 0;
                font: inherit;
                color: inherit;
                cursor: pointer;
                text-align: left;
                border-bottom: 1px dashed transparent;
            }
            .cx .cx-br-btn:hover {
                border-bottom-color: currentColor;
            }
            .cx .cx-br.sel {
                box-shadow: inset 0 0 0 2px hsl(var(--h, 214), 60%, 52%);
            }
            /* worktree 详情：每个 app 一节，launch 一行 */
            .wt-launches {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-bottom: 8px;
            }
            .wt-launch {
                display: grid;
                grid-template-columns: 8px auto auto 1fr auto;
                align-items: center;
                gap: 8px;
                padding: 5px 6px;
                border-radius: 7px;
                font-size: 12px;
            }
            .wt-launch:hover {
                background: #f6f8fa;
            }
            .wt-launch .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #c8ced6;
            }
            .wt-launch .dot.on {
                background: #22a35c;
            }
            .wt-launch .dot.wait {
                background: #d97706;
            }
            .wt-launch-nm {
                appearance: none;
                border: 0;
                background: transparent;
                padding: 0;
                font: 600 12px ui-monospace, Menlo, monospace;
                color: #123a6b;
                cursor: pointer;
                border-bottom: 1px dashed transparent;
            }
            .wt-launch-nm:hover {
                border-bottom-color: currentColor;
            }
            .wt-launch-cmd {
                font: 11px ui-monospace, Menlo, monospace;
                color: #6b7280;
            }
            .wt-launch-uri {
                font: 11px ui-monospace, Menlo, monospace;
                color: #8b95a1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            /* chip 旁的悬停操作（启动 / 停止 / 聚焦）：破坏性动作只出现在明确的按钮上 */
            .cx-launch {
                display: inline-flex;
                align-items: center;
                gap: 2px;
            }
            .cx-launch .acts {
                display: none;
                gap: 2px;
            }
            .cx .cx-cell:hover .cx-launch .acts {
                display: inline-flex;
            }
            .cx-launch .acts button {
                font-size: 9px;
                padding: 0 3px;
                border-radius: 4px;
                border: 1px solid hsl(var(--h), 34%, 72%);
                background: #fff;
                color: #2f353c;
            }
            /* 配置错误：chip 上加一道警示（点进去看修法） */
            .cx .cx-cell .chip.warn {
                box-shadow: inset 0 0 0 1px #d97706;
            }
            .chip.warn::after {
                content: "⚠";
                font-size: 9px;
                margin-left: 2px;
                color: #b45309;
            }
            /* 顶部计数里的配置问题提示 */
            #repo.bad {
                color: #b45309;
                font-weight: 600;
            }
            /* 配置问题卡 */
            .cfgissue {
                padding: 6px 0;
                border-top: 1px solid var(--line);
                font-size: 12px;
            }
            .cfgissue:first-of-type {
                border-top: 0;
            }
            .cfgmsg {
                color: #b45309;
            }
            .cfgfix {
                color: var(--dim);
                margin-top: 2px;
            }
            .wt-warn {
                appearance: none;
                border: 1px solid #d97706;
                background: #fffbeb;
                color: #b45309;
                border-radius: 5px;
                font-size: 10px;
                padding: 0 4px;
                cursor: pointer;
            }
            .hint.bad {
                color: #b45309;
            }
            /* 外部仓库：添加行 + 列表 */
            .refadd {
                display: flex;
                gap: 6px;
                padding: 8px 10px;
                border-bottom: 1px solid #eef0f3;
            }
            .refinput {
                flex: 1;
                min-width: 0;
                padding: 4px 8px;
                font-size: 11.5px;
                font-family: ui-monospace, Menlo, monospace;
                border: 1px solid var(--line);
                border-radius: 6px;
            }
            .refinput:focus {
                outline: none;
                border-color: var(--accent);
            }
            .reflist {
                flex: 1;
                overflow: auto;
                padding: 4px 0;
            }
            #tree {
                flex: 1;
                overflow: auto;
                padding: 4px 0;
            }
            .app {
                padding: 10px 14px 3px;
                font-size: 10.5px;
                color: var(--dim);
                letter-spacing: 0.4px;
                margin-top: 6px;
                border-top: 1px solid #eef0f3;
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: ui-monospace, Menlo, monospace;
            }
            .app .badge {
                margin-left: auto;
                font-size: 9.5px;
                padding: 1px 6px;
            }
            .appsub {
                padding: 6px 14px 2px;
                font-size: 11px;
                color: #5b6470;
                font-weight: 600;
            }
            .leaf {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 2px 12px 2px 34px;
                font-size: 11px;
                color: #4a5563;
            }
            .leaficon {
                font-size: 10px;
                color: var(--dim);
            }
            .leaf .link,
            .kv .link {
                color: var(--accent);
                text-decoration: none;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                word-break: break-all;
            }
            .leaf .link:hover,
            .kv .link:hover {
                text-decoration: underline;
            }
            .muted {
                color: var(--dim);
                font-size: 10.5px;
            }
            .entry.dim .nm {
                opacity: 0.5;
            }
            /* 四级树：每层一行、只放名字 */
            .lvl {
                padding: 5px 14px 2px;
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: #2f353c;
            }
            .lvl-repo {
                font-weight: 600;
                font-size: 12.5px;
                padding-top: 9px;
                color: #1f2328;
            }
            .lvl-wt {
                color: #5b6470;
                padding-left: 14px;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
            }
            .lvl-app {
                color: #5b6470;
                padding-left: 26px;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
            }
            .entry .nm {
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
            }
            /* titlebar 的过滤开关 */
            button.toggle {
                padding: 3px 10px;
                font-size: 11.5px;
                border-radius: 12px;
                border: 1px solid #cbd5e1;
                background: #fff;
                color: #555;
                cursor: pointer;
            }
            button.toggle:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            button.toggle.on {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .entry {
                display: flex;
                align-items: center;
                gap: 8px;
                /* 左缩进对齐到四级树的 launch 层（lvl-app 是 26px） */
                padding: 5px 10px 5px 38px;
                cursor: pointer;
                position: relative;
            }
            .entry:hover {
                background: #f4f7fc;
            }
            .entry.sel {
                background: #eaf1fd;
            }
            .entry.sel::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 2px;
                background: var(--accent);
            }
            .entry .nm {
                flex: 1;
                min-width: 0;
                font-size: 12.5px;
            }
            .entry .nm span {
                display: block;
                font-size: 10px;
                color: var(--dim);
                font-family: ui-monospace, Menlo, monospace;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .entry .acts {
                display: flex;
                gap: 3px;
                opacity: 0;
                transition: opacity 0.12s;
            }
            .entry:hover .acts,
            .entry.sel .acts {
                opacity: 1;
            }
            .entry .acts button {
                padding: 2px 6px;
                font-size: 10.5px;
                border-radius: 5px;
                border: 1px solid var(--line);
                background: #fff;
                cursor: pointer;
                line-height: 1.5;
                font-family: inherit;
            }
            .entry .acts button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .entry .acts button.stop {
                color: var(--err);
            }
            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .dot.on {
                background: var(--ok);
                box-shadow: 0 0 0 3px rgba(34, 163, 92, 0.15);
            }
            .dot.off {
                background: #d5d9e0;
            }
            .dot.wait {
                background: var(--warn);
            }

            /* 拖拉条（createSplitPane 创建，样式由这里给） */
            #split {
                background: transparent;
            }
            #split:hover {
                background: #dbe4f3;
            }

            #main {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            #head {
                padding: 12px 20px;
                border-bottom: 1px solid var(--line);
                background: #fff;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            #head h1 {
                font-size: 14.5px;
                font-weight: 600;
            }
            #head .m {
                font-size: 11px;
                color: var(--dim);
                font-family: ui-monospace, Menlo, monospace;
            }
            #body {
                flex: 1;
                overflow: auto;
                padding: 18px 20px;
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 14px 16px;
                margin-bottom: 12px;
            }
            .card h2 {
                font-size: 11px;
                font-weight: 600;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .card h2 .r {
                margin-left: auto;
                font-weight: 400;
                text-transform: none;
                letter-spacing: 0;
            }
            .kv {
                display: grid;
                grid-template-columns: 100px 1fr;
                gap: 6px 12px;
                font-size: 12.5px;
            }
            .kv dt {
                color: var(--dim);
            }
            .kv dd {
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
                word-break: break-all;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .kv dd .open {
                display: flex;
                gap: 3px;
                margin-left: auto;
                flex-shrink: 0;
            }
            .kv dd .open button {
                padding: 1px 6px;
                font-size: 10px;
                border-radius: 4px;
                border: 1px solid var(--line);
                background: #fff;
                cursor: pointer;
                font-family: inherit;
                color: #555;
            }
            .kv dd .open button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .acts {
                display: flex;
                gap: 7px;
                flex-wrap: wrap;
                margin-top: 13px;
            }
            button {
                padding: 6px 12px;
                border-radius: 7px;
                font: inherit;
                font-size: 12px;
                cursor: pointer;
                border: 1px solid #cbd5e1;
                background: #fff;
            }
            button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            button.pri {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            button.pri:hover {
                color: #fff;
                opacity: 0.92;
            }
            button.danger {
                color: var(--err);
                border-color: #e8c4c0;
            }
            button.small {
                padding: 5px 10px;
                font-size: 11.5px;
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 10.5px;
            }
            .badge.run {
                background: #e8f6ee;
                color: #1c7a43;
            }
            .badge.stop {
                background: #f0f1f3;
                color: #7a828d;
            }
            .badge.wait {
                background: #fdf3e3;
                color: #a15c05;
            }
            .uri {
                display: flex;
                align-items: center;
                gap: 8px;
                background: #f7f9fc;
                border: 1px solid #e0e6ef;
                border-radius: 7px;
                padding: 7px 10px;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                color: #2d6fd4;
            }
            .uri button {
                margin-left: auto;
                padding: 2px 8px;
                font-size: 10px;
                border-radius: 5px;
                flex-shrink: 0;
            }
            .cmdgrid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 6px;
            }
            .cmdgrid button {
                padding: 7px 0;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
            }
            .log {
                background: #1c1f24;
                color: #c8ccd4;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                padding: 11px;
                border-radius: 7px;
                max-height: 220px;
                overflow: auto;
                line-height: 1.65;
                white-space: pre-wrap;
            }
            .hint {
                font-size: 11.5px;
                color: var(--dim);
                margin-bottom: 10px;
            }
            .empty {
                padding: 60px 20px;
                text-align: center;
                color: var(--dim);
                font-size: 12.5px;
                white-space: pre-line;
            }
        </style>
    </head>
    <body>
        <div id="side">
            <div class="top">dev 启动器 <small id="running"></small></div>
            <div id="tree"></div>
        </div>
        <div id="main">
